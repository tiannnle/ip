name: Java CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Tests and JAR (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Zulu Java 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: gradle

      - name: Run tests and build JAR
        run: bash ./gradlew --no-daemon test shadowJar
